name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Build PHP image
        run: tools/ci/docker-compose build php
      - name: Install dependencies
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist
      - name: Run release quality gate
        run: tools/ci/docker-compose run --rm php composer ci
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
