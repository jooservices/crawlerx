# Optional fetch-lab workflow; it is not a required branch check.
name: Fetch lab

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: fetch-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch-lab:
    name: Fetch lab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: crawlerx-fetch-lab-${{ github.run_id }}
      CRAWLERX_NETWORK_NAME: crawlerx-fetch-lab-${{ github.run_id }}-network
      CRAWLERX_NETWORK_SUBNET: 10.254.200.0/24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build browser lab image
        run: docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch build node

      - name: Install PHP dependencies
        run: make install

      - name: Start fixture site and fetch sidecars
        run: docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch up -d --build --wait fixture-site node flaresolverr

      - name: Run Node browser lab
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch run --rm
          --env FIXTURE_SITE_URL=http://fixture-site:8080
          --volume "$PWD/tests:/app/tests:ro"
          node node --test tests/Browser/*.mjs

      - name: Run PHP fetch lab
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch run --rm
          --env CRAWLERX_FETCH_LAB=1
          --env CRAWLERX_FIXTURE_SITE_URL=http://fixture-site:8080
          --env PLAYWRIGHT_URL=http://node:3000
          --env FLARESOLVERR_URL=http://flaresolverr:8191/v1
          php ./vendor/bin/phpunit tests/Feature/FetchLab

      - name: Run Playwright version guard
        run: docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch run --rm --volume "$PWD:/workspace:ro" --workdir /workspace node node tools/check-playwright-version.mjs

      - name: Stop fetch lab services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.fetch-lab.yml -f docker-compose.no-ports.yml --profile fetch down --remove-orphans
