# Dedicated CI for jooservices/crawlerx — GitHub-hosted runners
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPCS
            command: composer lint:phpcs
          - name: PHPStan
            command: composer lint:phpstan
          - name: PHPMD
            command: composer lint:phpmd
          - name: PHP-CS-Fixer
            command: composer lint:cs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  architecture:
    name: Architecture (Deptrac)
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Deptrac analyse
        run: tools/ci/docker-compose run --rm php composer lint:deptrac

  security:
    name: Security (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache PHP image
        if: matrix.name == 'Dependencies'
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        if: matrix.name == 'Dependencies'
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        if: matrix.name == 'Dependencies'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: matrix.name == 'Dependencies' && steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer audit
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose run --rm php composer audit

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@v5

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --config=.gitleaks.toml --exit-code 1

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error

  test-shards:
    name: Test shard (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: Unit
            shard: 1
            total: 2
          - suite: Unit
            shard: 2
            total: 2
          - suite: Feature
            shard: 1
            total: 4
          - suite: Feature
            shard: 2
            total: 4
          - suite: Feature
            shard: 3
            total: 4
          - suite: Feature
            shard: 4
            total: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run sharded suite with coverage
        run: |
          set -euo pipefail
          mkdir -p build/coverage build/shards
          list="build/shards/${{ matrix.suite }}-${{ matrix.shard }}.paths"
          tools/ci/docker-compose run --rm php php tools/ci/phpunit-shard.php \
            "tests/${{ matrix.suite }}" ${{ matrix.shard }} ${{ matrix.total }} "${list}"
          mapfile -t files < "${list}"
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --coverage-clover="build/coverage/clover-${{ matrix.suite }}-${{ matrix.shard }}.xml" \
            "${files[@]}"

      - name: Upload shard coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.shard }}
          path: build/coverage/clover-${{ matrix.suite }}-${{ matrix.shard }}.xml
          if-no-files-found: error

  test:
    name: Test (${{ matrix.name }})
    needs: [test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Unit
            suite: Unit
            total: 2
          - name: Feature
            suite: Feature
            total: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Download shard coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-${{ matrix.suite }}-*
          path: build/coverage/shards
          merge-multiple: true

      - name: Merge shard coverage
        run: |
          set -euo pipefail
          mkdir -p build/coverage
          inputs=()
          for shard in $(seq 1 ${{ matrix.total }}); do
            inputs+=("build/coverage/shards/clover-${{ matrix.suite }}-${shard}.xml")
          done
          tools/ci/docker-compose run --rm php php tools/coverage-merge-clovers.php \
            "build/coverage/clover-${{ matrix.suite }}.xml" "${inputs[@]}"
          ls -la build/coverage

      - name: Upload suite coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.suite }}
          path: build/coverage/clover-${{ matrix.suite }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test, security, architecture]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful test, security, and architecture checks
        if: ${{ needs.test.result != 'success' || needs.security.result != 'success' || needs.architecture.result != 'success' }}
        run: |
          echo "::error::Coverage upload requires successful test, security, and architecture checks."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache PHP image
        id: php-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/crawlerx-php85.tar
          key: crawlerx-php85-${{ hashFiles('Dockerfile') }}

      - name: Load or build PHP image
        run: |
          set -euo pipefail
          if [[ -f /tmp/crawlerx-php85.tar ]]; then
            docker load -i /tmp/crawlerx-php85.tar
          else
            tools/ci/docker-compose build php
            docker save jooservices/crawlerx:php85 -o /tmp/crawlerx-php85.tar
          fi

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and merge Clover reports
        run: |
          set -euo pipefail
          # Ignore shard-only clover files; the suite aggregators upload clover-Unit/Feature.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Unit.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Feature.xml
          tools/ci/docker-compose run --rm php php tools/coverage-union.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Feature.xml 90
          tools/ci/docker-compose run --rm php php tools/coverage-merge.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Feature.xml \
            build/coverage/clover-combined.xml
          ls -la build/coverage

      - name: Upload to Codecov
        if: github.event.pull_request.user.type != 'Bot'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          verbose: true

      - name: Resolve SonarQube host URL
        if: github.event.pull_request.user.type != 'Bot'
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        if: github.event.pull_request.user.type != 'Bot'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=build/coverage/clover-combined.xml
