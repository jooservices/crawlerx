# Dedicated CI for jooservices/crawlerx — GitHub-hosted runners
name: CI

on:
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer validate
        run: tools/ci/docker-compose run --rm php composer validate --strict

  lint:
    name: Lint (${{ matrix.name }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Pint
            command: composer lint:pint
          - name: PHPCS
            command: composer lint:phpcs
          - name: PHPStan
            command: composer lint:phpstan
          - name: PHPMD
            command: composer lint:phpmd
          - name: PHP-CS-Fixer
            command: composer lint:cs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run linter
        run: tools/ci/docker-compose run --rm php ${{ matrix.command }}

  security:
    name: Security (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Dependencies
          - name: Secrets
          - name: SAST
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        if: matrix.name == 'Dependencies'
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: matrix.name == 'Dependencies' && steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Composer audit
        if: matrix.name == 'Dependencies'
        run: tools/ci/docker-compose run --rm php composer audit

      - name: OSV Scanner
        if: matrix.name == 'Dependencies'
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            .

      - name: Dependency Review
        if: matrix.name == 'Dependencies'
        uses: actions/dependency-review-action@v5

      - name: Gitleaks OSS CLI
        if: matrix.name == 'Secrets'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --config=.gitleaks.toml --exit-code 1

      - name: Semgrep (OSS)
        if: matrix.name == 'SAST'
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep scan --config p/php --error

  test:
    name: Test (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Unit
            suite: Unit
          - name: Feature
            suite: Feature
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Cache Composer vendor
        uses: actions/cache@v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-vendor-

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: tools/ci/docker-compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run test suite with coverage
        run: |
          mkdir -p build/coverage
          tools/ci/docker-compose run --rm php ./vendor/bin/phpunit \
            --testsuite=${{ matrix.suite }} \
            --coverage-clover=build/coverage/clover-${{ matrix.suite }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: build/coverage/clover-${{ matrix.suite }}.xml
          if-no-files-found: error

  coverage:
    name: Coverage upload
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build PHP image
        run: tools/ci/docker-compose build php

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: build/coverage/matrix
          merge-multiple: true

      - name: Enforce coverage and merge Clover reports
        run: |
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Unit.xml
          tools/ci/docker-compose run --rm php php tools/coverage-enforce.php build/coverage/matrix/clover-Feature.xml
          tools/ci/docker-compose run --rm php php tools/coverage-merge.php \
            build/coverage/matrix/clover-Unit.xml \
            build/coverage/matrix/clover-Feature.xml \
            build/coverage/clover-combined.xml
          ls -la build/coverage

      - name: Install Codecov CLI
        if: github.event.pull_request.user.type != 'Bot'
        run: |
          python3 -m venv /tmp/codecov-venv
          /tmp/codecov-venv/bin/pip install --disable-pip-version-check codecov-cli

      # ingest.codecov.io certificate expired 2026-10-04T23:59:59Z.
      # The coverage floor above still fails this job. Upload stays attempted.
      - name: Upload to Codecov
        if: github.event.pull_request.user.type != 'Bot'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/clover-combined.xml
          fail_ci_if_error: true
          binary: /tmp/codecov-venv/bin/codecovcli
          verbose: true

      - name: Resolve SonarQube host URL
        if: github.event.pull_request.user.type != 'Bot'
        id: sonar-config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          host_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          host_url="${host_url%/}"
          case "${host_url}" in
            http://*|https://*) ;;
            *) host_url="https://${host_url}" ;;
          esac
          if [[ ! "${host_url}" =~ ^https?://[^[:space:]/]+ ]]; then
            echo "SONAR_HOST_URL must be a valid HTTP(S) URL"
            exit 1
          fi
          echo "host_url=${host_url}" >> "${GITHUB_OUTPUT}"

      - name: Upload SonarQube analysis
        if: github.event.pull_request.user.type != 'Bot'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ steps.sonar-config.outputs.host_url }}
        with:
          args: >
            -Dsonar.php.coverage.reportPaths=build/coverage/clover-combined.xml
