'tests':
  - changed-files:
    - any-glob-to-any-file: 'tests/**/*'
'fixtures':
  - changed-files:
    - any-glob-to-any-file: 'tests/Fixtures/**/*'
'documentation':
  - changed-files:
    - any-glob-to-any-file: ['**.md', 'docs/**/*']
'dependencies':
  - changed-files:
    - any-glob-to-any-file: ['composer.json', 'composer.lock', 'package.json', 'package-lock.json']
'ci/cd':
  - changed-files:
    - any-glob-to-any-file: ['.github/**/*', 'captainhook.json', 'Dockerfile', 'docker-compose.yml']
'configuration':
  - changed-files:
    - any-glob-to-any-file: ['**.xml', '**.neon', '.php-cs-fixer.dist.php', 'pint.json']
'source':
  - changed-files:
    - any-glob-to-any-file: 'src/**/*'
