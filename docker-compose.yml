services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: jooservices/crawlerx:php85
    working_dir: /app
    volumes:
      - .:/app
      - crawlerx_node_modules:/app/node_modules
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      CRAWLERX_FLARESOLVERR_URL: http://flaresolverr:8191/v1
      CRAWLERX_BROWSER_SERVICE_URL: http://node:3000
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    tty: true

  node:
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        CRAWLERX_VERSION: ${CRAWLERX_VERSION:-dev}
    image: jooservices/crawlerx:browser
    working_dir: /app
    environment:
      CRAWLERX_NODE: node
      CRAWLERX_PLAYWRIGHT_SCRIPT: /app/scripts/playwright-fetch.mjs
      CRAWLERX_BROWSER_SERVICE_PORT: 3000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    profiles: ["fetch"]
    init: true
    command: ["node", "scripts/fetch-server.mjs"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      fixture-site:
        condition: service_healthy

  fixture-site:
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    working_dir: /app
    volumes:
      - ./tests/Fixtures/site:/app/tests/Fixtures/site:ro
    environment:
      PORT: 8080
    profiles: ["fetch"]
    command: ["node", "tests/Fixtures/site/server.mjs"]
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${FIXTURE_SITE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/__hits').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    profiles: ["fetch"]
    environment:
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${FLARESOLVERR_HOST_PORT:-8191}:8191"
    restart: unless-stopped

volumes:
  crawlerx_node_modules:

networks:
  default:
    name: ${CRAWLERX_NETWORK_NAME:-crawlerx-network}
    ipam:
      config:
        - subnet: ${CRAWLERX_NETWORK_SUBNET:-10.253.0.0/24}
