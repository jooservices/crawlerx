# Architecture layers for CrawlerX (JOOXCR-466). Report-only in CI — violations
# are visible but do not fail the required quality gate yet.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*test.*#'
  layers:
    - name: Adapters
      collectors:
        - type: directory
          value: src/Adapters/.*
    - name: Fetch
      collectors:
        - type: directory
          value: src/Fetch/.*
    - name: Dto
      collectors:
        - type: directory
          value: src/Dto/.*
    - name: Support
      collectors:
        - type: directory
          value: src/Support/.*
    - name: Contracts
      collectors:
        - type: directory
          value: src/Contracts/.*
  ruleset:
    # Adapters → Fetch is intentional debt today (AbstractType → ChallengeDetector).
    # Leave it disallowed so the report-only CI job keeps surfacing it.
    Adapters:
      - Contracts
      - Dto
      - Support
    Fetch:
      - Contracts
      - Dto
      - Support
    Support:
      - Contracts
      - Dto
    Contracts:
      - Dto
    Dto: ~
